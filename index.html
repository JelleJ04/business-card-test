<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>John Smith | Guest Feedback</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .profile {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            background: #ddd;
        }

        h1 {
            margin: 5px 0;
            font-size: 28px;
        }

        .role {
            color: #777;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 25px;
        }

        .button {
            display: block;
            padding: 15px;
            margin: 12px 0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            background: #111;
            color: white;
        }

        .button:hover {
            opacity: 0.85;
        }

        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="profile"></div>

        <h1>John Smith</h1>

        <div class="role">
            Front Office
        </div>

        <h2>How was your experience?</h2>

        <p class="description">
            We would love to hear about your experience with John.
            Your feedback is greatly appreciated.
        </p>

        <a class="button"
           href="https://www.tripadvisor.com/"
           target="_blank">
            ⭐ Leave a review on Tripadvisor
        </a>

        <a class="button"
           href="https://www.google.com/"
           target="_blank">
            ⭐ Leave a review on Google
        </a>

        <div class="footer">
            Thank you for your feedback!
        </div>

    </div>

</body>
</html>
